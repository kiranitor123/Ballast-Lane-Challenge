server:
  port: 8080

spring:
  application:
    name: pokemon-api
  datasource:
    url: jdbc:h2:file:./data/pokemondb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

pokeapi:
  base-url: https://pokeapi.co/api/v2

jwt:
  secret: SECRET_KEY_404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
